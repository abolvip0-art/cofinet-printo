<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<title>ارتباط با Printo</title>
<style>
:root{color-scheme:light;--ink:#20242b;--muted:#7b8491;--line:#e8ebef;--bg:#f7f8fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,420px);text-align:center}
.brand{font-size:30px;font-weight:800;letter-spacing:.4px;margin:0 0 8px}
.sub{font-size:14px;color:var(--muted);margin:0 0 30px}
.links{display:grid;gap:12px}
a{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 17px;
transition:transform .15s,border-color .15s;box-shadow:0 5px 18px #18202a08}
a:hover{transform:translateY(-2px);border-color:#cbd2dc}
.icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
font-size:18px;font-weight:800;color:#fff;flex:none}
.telegram{background:#279bd6}.bale{background:#20a56b}.rubika{background:#8b5cf6}
.name{font-size:15px;font-weight:700;text-align:right}
.handle{font-size:12px;color:var(--muted);margin-top:5px;text-align:right;direction:ltr}
.arrow{margin-right:auto;color:#a1a8b2;font-size:20px}
footer{font-size:11px;color:#a0a7b1;margin-top:26px}
</style>
</head>
<body>
<main>
  <h1 class="brand">Printo</h1>
  <p class="sub">برای ارتباط، یکی از پیام‌رسان‌ها را انتخاب کنید</p>
  <section class="links" aria-label="راه‌های ارتباطی">
    <a href="https://t.me/printo0" target="_blank" rel="noopener noreferrer">
      <span class="icon telegram">T</span>
      <span><div class="name">تلگرام</div><div class="handle">@printo0</div></span>
      <span class="arrow">‹</span>
    </a>
    <a href="https://ble.ir/printo1" target="_blank" rel="noopener noreferrer">
      <span class="icon bale">ب</span>
      <span><div class="name">بله</div><div class="handle">printo1</div></span>
      <span class="arrow">‹</span>
    </a>
    <a href="https://rubika.ir/Printo1" target="_blank" rel="noopener noreferrer">
      <span class="icon rubika">R</span>
      <span><div class="name">روبیکا</div><div class="handle">Printo1</div></span>
      <span class="arrow">‹</span>
    </a>
  </section>
  <footer>Printo · راه‌های ارتباطی</footer>
</main>
</body>
</html>
